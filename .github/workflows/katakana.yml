# 変更で足した行から、カタカナ語の語尾の長音符を省いた表記を検出する (ci/katakana/check.sh)。
# ほかのリポジトリからも workflow_call で呼ばれる。required check にはしない (結果はレビューで見る)。
# pull_request_target は使わない。権限は contents: read だけで、secrets を使わない。
name: katakana

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 待っている run は新しい run に置き換わり、push ごとの差分が検査されないまま残るので、
    # 取り消しは pull_request のときだけにする (push は run ごとに別の group)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('katakana-{0}-{1}', github.repository, github.ref) || format('katakana-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # pull_request の既定のマージ commit ではなく、PR の head を読む (差分の行番号と中身を head に合わせる)
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 検査の本体。呼び出し元が dotfiles なら同じ commit、それ以外は main を使う。
      # .katakana は呼び出し元で追跡されないので、検査の対象に入らない
      - name: checkout check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moscowmule2240/dotfiles
          ref: ${{ github.repository == 'moscowmule2240/dotfiles' && (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) || 'main' }}
          path: .katakana
          persist-credentials: false

      # 検査の本体を変えたときに壊していないか確かめる
      - name: test check script
        id: test
        if: github.repository == 'moscowmule2240/dotfiles'
        run: bash .katakana/ci/katakana/test.sh

      # 検査の本体のテストだけが落ちたときも、検査そのものは流す (別々の合図で、片方の失敗でもう片方を隠さない)
      - name: check
        if: ${{ success() || steps.test.outcome == 'failure' }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            head=$PR_HEAD
          else
            base=$PUSH_BEFORE
            head=$SHA
          fi
          bash .katakana/ci/katakana/check.sh "$base" "$head"
